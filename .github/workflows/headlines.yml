name: headlines

# 가벼운 회차 (worker/collect.py, LIGHT=1): ① 목록 · ② 고르기 · 제목 묶음(headlines), 그리고 2곳 이상이 다룬 사건만
# 본문 20건 ③ 받기 · ④ 사실 · ⑤ 사건 → 블로그 저장소 facts (요청-알파스코프-뉴스-글-발행 31절 R38 · R39). 글쓰기는 하지 않는다.
# 블로그가 평일 12:20 · 15:20 KST에 facts를 읽는다. 그 전에 끝나게 수집기가 일찍 돈다(사용자 11-26 "블로그는 그대로").
# GitHub 예약은 50 ~ 65분(정기 회차는 85분까지) 늦게 시작하고, 가벼운 회차는 20 ~ 30분(503 많으면 +15분) 걸린다.
# 그래서 10:20 · 13:20에 예약한다 → 보통 11:10 ~ 11:25 · 14:10 ~ 14:25에 시작해 11:30 ~ 11:50 · 14:30 ~ 14:50에 끝난다.
on:
  schedule:
    - cron: "20 1 * * 1-5"   # 평일 10:20 KST 예약 → 블로그 12:20 받기 전에 끝나게
    - cron: "20 4 * * 1-5"   # 평일 13:20 KST 예약 → 블로그 15:20 받기 전에 끝나게
  workflow_dispatch:

concurrency:
  group: outlets      # collect · probe와 같은 줄: 언론사에 두 실행이 겹쳐 요청하지 않게
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  headlines:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - run: pip install -r worker/requirements.txt

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: 목록 · 고르기 · 제목 묶음 · 사실(2곳 이상 20건)
        working-directory: worker
        run: python collect.py
        env:
          PYTHONUNBUFFERED: "1"
          LIGHT: "1"
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          BLOG_PROJECT: ${{ vars.BLOG_PROJECT }}
          BLOG_DATABASE: ${{ vars.BLOG_DATABASE }}
