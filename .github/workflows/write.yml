name: write

# 2단계 글쓰기만 따로 (worker/write.py). 가장 최근 사건 목록으로 초안을 쓴다. 언론사에는 접속하지 않는다.
# 결과는 Firestore posts에만 남고, 로그에는 건수 · 상태만 찍힌다.
on:
  workflow_dispatch:
    inputs:
      write_max:
        description: "쓸 글 수 (비우면 시각에 따라 2 또는 3)"
        type: string
        default: ""

concurrency:
  group: write
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  write:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - run: pip install -r worker/requirements.txt

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: 글쓰기
        working-directory: worker
        run: python write.py
        env:
          PYTHONUNBUFFERED: "1"
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_WRITE_MODELS: ${{ vars.GEMINI_WRITE_MODELS }}
          GEMINI_CHECK_MODELS: ${{ vars.GEMINI_CHECK_MODELS }}
          BLOG_PROJECT: ${{ vars.BLOG_PROJECT }}
          BLOG_DATABASE: ${{ vars.BLOG_DATABASE }}
          WRITE_MAX: ${{ inputs.write_max }}
